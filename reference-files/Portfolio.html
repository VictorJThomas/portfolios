<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Developer — A Portfolio in Several Volumes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
/* ============ THEME TOKENS ============ */
:root {
  /* Wes Anderson palette — one accent per screen */
  --c-cream: #F2E8D0;
  --c-cream-warm: #EFE3C4;
  --c-cream-deep: #E5D6B2;
  --c-ink: #15262E;          /* near-black teal ink */
  --c-paper-back: #E8DEC4;   /* underside of pages */

  /* Per-scene */
  --teal: #2D4D5C;           /* Home — Life Aquatic */
  --teal-deep: #1F3946;
  --blush: #E8B7B0;          /* Projects — Grand Budapest */
  --blush-deep: #D89B95;
  --mustard: #D4B055;        /* Field Manual — Moonrise scout */
  --mustard-deep: #B89538;
  --forest: #4A5D3E;         /* Experience — Tenenbaums tweed */
  --forest-deep: #36462C;
  --wine: #7D3340;           /* Stack — Budapest crimson */
  --wine-deep: #5F2530;
  --parchment: #E7D9B8;      /* Project Detail */
  --mauve: #B69CB5;          /* Contact — Budapest lavender */
  --mauve-deep: #8E7691;

  --serif-display: 'Playfair Display', 'Times New Roman', serif;
  --serif-body: 'Cormorant Garamond', Georgia, serif;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #0d0d0d; font-family: var(--serif-body); color: var(--c-ink); -webkit-font-smoothing: antialiased; }
body { overflow: hidden; }

/* ============ STAGE — viewport-locked page area ============ */
#root { height: 100vh; width: 100vw; position: relative; overflow: hidden; }

.stage {
  position: absolute; inset: 0;
  perspective: 2400px;
  perspective-origin: 50% 50%;
  background: #0d0d0d;
}

/* ============ PAGE (single screen) ============ */
.page {
  position: absolute; inset: 0;
  overflow: hidden;
  background: var(--page-bg, var(--cream));
  /* slight paper texture overlay; layered in each screen */
}

/* corner ticks */
.page::before, .page::after {
  content:''; position:absolute; width: 18px; height: 18px;
  border-color: var(--page-ink, var(--c-cream));
  border-style: solid;
  pointer-events: none;
  opacity: .35;
}

.page-inner {
  position: absolute;
  inset: 28px;
  border: 1px solid color-mix(in oklab, var(--page-ink, currentColor) 50%, transparent);
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

/* Custom scrollbars — keep the book aesthetic */
.page-inner ::-webkit-scrollbar { width: 8px; height: 8px; }
.page-inner ::-webkit-scrollbar-track { background: transparent; }
.page-inner ::-webkit-scrollbar-thumb { background: currentColor; opacity: .2; border-radius: 4px; }

/* ===== Paper grain ===== */
.grain {
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: .07;
  mix-blend-mode: multiply;
  background-image:
    radial-gradient(circle at 22% 17%, rgba(0,0,0,.6) 0 .5px, transparent 1.5px),
    radial-gradient(circle at 71% 53%, rgba(0,0,0,.5) 0 .5px, transparent 1.5px),
    radial-gradient(circle at 38% 81%, rgba(0,0,0,.4) 0 .5px, transparent 1.5px),
    radial-gradient(circle at 86% 12%, rgba(0,0,0,.6) 0 .5px, transparent 1.5px);
  background-size: 9px 9px, 13px 13px, 11px 11px, 17px 17px;
}

/* ===== Reusable type ===== */
.mono { font-family: var(--mono); text-transform: uppercase; letter-spacing: .14em; font-weight: 500; }
.italic { font-family: var(--serif-body); font-style: italic; }
.display { font-family: var(--serif-display); font-weight: 700; letter-spacing: -.01em; line-height: .92; }

/* ===== Buttons / links ===== */
button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }

/* ============ PAGE TURN ANIMATION (2D diagonal fold) ============
   The outgoing page gets clipped progressively from the bottom-right
   corner along a moving fold-line that travels toward the top-left.
   A flap element shows the back-of-page paper covering the folded area.
   Pure 2D — smooth and performant.
============================================================== */
.page-stack { position: absolute; inset: 0; }
.page-layer { position: absolute; inset: 0; }

/* OUTGOING page: clipped to the pentagon "Region A" (page minus the
   triangle that's been folded). */
.outgoing-page {
  position: absolute; inset: 0;
  clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 100% 100%, 0% 100%);
  will-change: clip-path;
}
.page-stack.turning .outgoing-page {
  animation: foldOutgoing var(--turn-ms, 900ms) cubic-bezier(.55,.05,.35,.95) forwards;
}
@keyframes foldOutgoing {
  0%   { clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 100% 100%, 0% 100%); }
  100% { clip-path: polygon(0% 0%, 100% 0%, 100% 0%,  0%   100%, 0% 100%); }
}

/* FLAP: a triangle that represents the folded-back portion of the
   outgoing page, lying on top. Shows the paper underside. */
.fold-flap {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 80% at 100% 100%, rgba(0,0,0,0.0) 35%, rgba(0,0,0,0.18) 80%),
    repeating-linear-gradient(135deg, var(--c-paper-back) 0 3px, color-mix(in oklab, var(--c-paper-back) 91%, black) 3px 4px);
  clip-path: polygon(100% 100%, 100% 100%, 100% 100%);
  will-change: clip-path, opacity;
  filter: drop-shadow(-3px -3px 6px rgba(0,0,0,.18));
  opacity: 1;
}
.page-stack.turning .fold-flap {
  animation:
    growFlap var(--turn-ms, 900ms) cubic-bezier(.55,.05,.35,.95) forwards,
    flapFade var(--turn-ms, 900ms) ease-in forwards;
}
@keyframes growFlap {
  0%   { clip-path: polygon(100% 100%, 100% 100%, 100% 100%); }
  100% { clip-path: polygon(100%   0%,   0%   0%,   0% 100%); }
}
@keyframes flapFade {
  0%, 75% { opacity: 1; }
  100%    { opacity: 0; }
}

/* incoming page subtle warm-up */
.page-stack.turning .incoming {
  animation: incomingFade var(--turn-ms, 900ms) ease-out forwards;
}
@keyframes incomingFade {
  0%   { filter: brightness(.92); }
  100% { filter: brightness(1); }
}

/* ============ Responsive ============ */
@media (max-width: 720px) {
  .page-inner { inset: 14px; }
}

/* ============ Audio toast ============ */
.audio-hint {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
  background: rgba(15,15,15,.86); color: #f5e9c8;
  padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(245,233,200,.2);
  pointer-events: none; opacity: 0; transition: opacity .4s;
  z-index: 200;
}
.audio-hint.show { opacity: 1; }

</style>
</head>
<body>
<div id="root"></div>
